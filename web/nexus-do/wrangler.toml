# ⚠️ 本仓(公开版)部署目标 Worker = blackgod88；实际以 wrangler.jsonc 为准(wrangler 优先读 jsonc)。
# name 必须与 CF 面板 Worker 名一致，否则 Git 集成构建在部署阶段直接失败。
name = "blackgod88"
main = "nexus_do.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "aquan.lufei.uk", zone_id = "824bdc2b31476c82c066e28ca1fa5a68" }
]

[[durable_objects.bindings]]
name = "SHENSHU"
class_name = "ShenshuCore"


[[kv_namespaces]]
binding = "SOUL_KV"
id = "2978edea205e462d97cd3613f4745fbf"

[ai]
binding = "AI"

[vars]
# 曼谷多模态工厂（生图/18情绪语音/真视频），神枢优先调它，CF AI 兜底
FACTORY_URL = "https://factory.aquan.xin"
