name: Server CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 融合内核集成测试
        run: python3 server/test_integration.py

      - name: 语气微调测试
        run: python3 server/test_tone_hint.py

      - name: Agent Studio 端到端冒烟测试
        run: python3 server/test_agent_studio.py
