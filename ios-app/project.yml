# project.yml — 神枢 Black God iOS 工程定义（xcodegen）
# 用法：cd ios-app && xcodegen generate
#
# 纯客户端架构：用户自带 Anthropic API Key，直连模型，本地存储，零后端。
# 上架参数（Bundle ID / 版本号）见 AppStore/SUBMIT_GUIDE.md，改动前先看那份指南。

name: BlackGod888
options:
  bundleIdPrefix: com.blackgod
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  # 除开发语言外附带的本地化语言（对应 en.lproj）
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    # App Store 版本号，语义化三段式；构建号每次上传 +1
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Codemagic / Xcode 自动签名；无凭据时可通过命令行覆盖为 NO 做验证构建
    CODE_SIGNING_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Distribution"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BlackGod888:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
          - "**/*.swift"
      # 多语言资源：Localizable.strings / InfoPlist.strings
      - path: zh-Hans.lproj
      - path: en.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod.nexus
        # 桌面显示名由 InfoPlist.strings 按语言覆盖（中文「神枢」/ 英文「Nexus」）
        INFOPLIST_KEY_CFBundleDisplayName: "神枢"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BlackGod888.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        # 只使用 HTTPS 标准加密，免于提交出口合规文档
        ITSAppUsesNonExemptEncryption: false
        # 仅访问 api.anthropic.com（HTTPS），不放开任意明文加载，避免审核质疑
        NSMicrophoneUsageDescription: "语音输入需要使用麦克风。"
        NSPhotoLibraryAddUsageDescription: "用于把生成的图片保存到相册。"
        UIAppFonts: []
