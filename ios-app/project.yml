# project.yml — 神枢 Black God iOS 工程定义（xcodegen）
# 用法：cd ios-app && xcodegen generate
#
# 纯客户端架构：用户配置服务商认证，直连模型，本地存储，零后端。
# 上架参数（Bundle ID / 版本号）见 AppStore/SUBMIT_GUIDE.md，改动前先看那份指南。

name: BlackGod
options:
  bundleIdPrefix: com.blackgod
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  # 除开发语言外附带的本地化语言（对应 en.lproj）
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    # App Store 版本号，语义化三段式；构建号每次上传 +1
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "24"
    DEVELOPMENT_TEAM: ""
    # Codemagic / Xcode 自动签名；无凭据时可通过命令行覆盖为 NO 做验证构建
    CODE_SIGNING_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Distribution"
    SWIFT_EMIT_LOC_STRINGS: YES
