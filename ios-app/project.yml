# project.yml — 神枢 Black God iOS 工程定义（xcodegen）
# 用法：cd ios-app && xcodegen generate
#
# 纯客户端架构：用户配置服务商认证，直连模型，本地存储，零后端。
# 上架参数（Bundle ID / 版本号）见 AppStore/SUBMIT_GUIDE.md，改动前先看那份指南。

name: BlackGod
options:
  bundleIdPrefix: com.blackgod
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  # 除开发语言外附带的本地化语言（对应 en.lproj）
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    # App Store 版本号，语义化三段式；构建号每次上传 +1
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
    # Codemagic / Xcode 自动签名；无凭据时可通过命令行覆盖为 NO 做验证构建
    CODE_SIGNING_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Distribution"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BlackGod:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Runtime
        includes: ["*.m", "*.h"]
      - path: Runtime/AlpineRootfs
        type: folder
        buildPhase: resources
      - path: ShuyuRuntime
        type: folder
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: AppStore/PRIVACY_POLICY.md
        buildPhase: resources
      - path: Assets.xcassets
      # 多语言资源：Localizable.strings / InfoPlist.strings
      - path: zh-Hans.lproj
        type: folder
        buildPhase: resources
      - path: en.lproj
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod.nexus
        SWIFT_OBJC_BRIDGING_HEADER: Runtime/BlackGod-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../vendor", "$(SRCROOT)/../vendor/ish", "$(SRCROOT)/Runtime"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GUEST_ARM64=1", "ENGINE_ASBESTOS=1"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Runtime/Libs/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lish", "-lish_emu", "-lfakefs", "-lsqlite3"]
        # 桌面显示名由 InfoPlist.strings 按语言覆盖（中文「神枢」/ 英文「Nexus」）
        INFOPLIST_KEY_CFBundleDisplayName: "Black God"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BlackGod.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Black God
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        # 只使用 HTTPS 标准加密，免于提交出口合规文档
        ITSAppUsesNonExemptEncryption: false
        # 模型与认证使用 HTTPS；仅本机 OAuth 回调允许本地网络。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "语音输入需要使用麦克风。"
        NSPhotoLibraryAddUsageDescription: "用于把生成的图片保存到相册。"
        UIAppFonts: []

  BlackGodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../tests/ios
    dependencies:
      - target: BlackGod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod.nexus.tests

  BlackGodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../tests/ui
    dependencies:
      - target: BlackGod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod.nexus.uitests

schemes:
  BlackGod:
    build:
      targets:
        BlackGod: all
        BlackGodTests: [test]
        BlackGodUITests: [test]
    test:
      targets: [BlackGodTests, BlackGodUITests]
