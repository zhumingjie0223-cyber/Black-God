name: BlackGod888
options:
  bundleIdPrefix: com.blackgod888
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  BlackGod888:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod888.app
        INFOPLIST_KEY_CFBundleDisplayName: "黑神888"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BlackGod888.entitlements
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "语音输入需要麦克风权限"
        NSPhotoLibraryUsageDescription: "保存生成的图片"
        NSLocalNetworkUsageDescription: "神枢仅在你主动连接受控设备桥接或局域网运行时访问本地网络。"
        NSBonjourServices:
          - "_nexus-bridge._tcp"
        UIAppFonts: []

  NexusPacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NexusPacketTunnel
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackgod888.app.nexustunnel
        CODE_SIGN_ENTITLEMENTS: NexusPacketTunnel.entitlements
        SKIP_INSTALL: YES
    info:
      path: NexusPacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
        NSLocalNetworkUsageDescription: "神枢受控网络扩展仅在主人显式启用后建立受管理网络路径。"
