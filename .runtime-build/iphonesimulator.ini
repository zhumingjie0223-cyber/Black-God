[binaries]
c = ['clang', '-target', 'arm64-apple-ios17.0-simulator', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator26.5.sdk']
ar = 'ar'
strip = 'strip'
pkg-config = 'false'
[host_machine]
system = 'darwin'
