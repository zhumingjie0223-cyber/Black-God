workflows:
  ios-release:
    name: 神枢 iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BLACKGOD_APP_STORE_CONNECT
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blackgod.nexus
      vars:
        XCODE_WORKSPACE: ios-app/BlackGod888.xcodeproj
        XCODE_SCHEME: BlackGod888
      xcode: latest
    scripts:
      - name: 上架就绪自检(preflight)
        script: node ios-app/AppStore/preflight.mjs
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: cd ios-app && xcodegen generate
      - name: Resolve signing
        script: xcode-project use-profiles
      - name: Build archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 自动提交 App Store 审核。首次上架前必须先在 App Store Connect 建好 App 记录,
        # 并把商店信息(描述/截图/隐私问卷/分级,材料见 ios-app/AppStore/)填好,否则提审会失败。
        # 若只想先进 TestFlight、暂不自动提审,把下面改回 false 即可。
        submit_to_app_store: true
      email:
        recipients:
          - "$CM_NOTIFY_EMAIL"
        notify:
          success: true
          failure: true
