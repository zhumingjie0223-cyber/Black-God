name: Nexus DO CI

on:
  push:
    branches:
      - main
    paths:
      - "web/nexus-do/**"
      - "!web/nexus-do/**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "web/nexus-do/**"
      - "!web/nexus-do/**/*.md"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/nexus-do
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: node build.mjs

      - name: Selftest（228项）
        run: node selftest.mjs

      - name: 逐个单跑 .test.mjs（避免并发 OOM）
        shell: bash
        run: |
          for f in *.test.mjs; do
            echo "▶ $f"
            node --test "$f" || exit 1
          done

      - name: UI 双副本同步校验（强制）
        run: node ../../tools/sync-ui.mjs --check
