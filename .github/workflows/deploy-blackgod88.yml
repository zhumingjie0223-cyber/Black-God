name: Deploy blackgod88

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'worker.mjs'
      - 'config/wrangler.jsonc'
      - '.github/workflows/deploy-blackgod88.yml'
  workflow_dispatch:

concurrency:
  group: deploy-blackgod88
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest --no-audit --no-fund

      - name: Build nexus-do index.html
        run: |
          cd web/nexus-do
          npm install
          npm run build

      - name: Prepare public assets
        run: |
          mkdir -p public
          cp web/nexus-do/index.html public/index.html
          echo "✅ public/index.html ready ($(wc -c < public/index.html) bytes)"

      - name: Stamp build time
        run: |
          BUILD_TIME=$(date -u +%Y%m%dT%H%M%SZ)
          sed -i "s/__BUILD_TIME__/$BUILD_TIME/" worker.mjs
          sed -i "s/__BUILD_TIME__/$BUILD_TIME/" public/index.html

      - name: Deploy
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config config/wrangler.jsonc

      - name: Verify online
        if: ${{ env.CF_TOKEN != '' }}
        run: |
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://blackgod88.jjiebbay.workers.dev/)
          echo "/ → $CODE"
          [ "$CODE" = "200" ] && echo "✅ Worker 已上线" || (echo "❌ 异常 code=$CODE"; exit 1)

      - name: Skip notice
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN，跳过部署。"
