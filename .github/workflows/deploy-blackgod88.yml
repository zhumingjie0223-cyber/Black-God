name: Deploy blackgod88

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'worker.mjs'
      - 'config/wrangler.jsonc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@4 --no-audit --no-fund

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 142c76e0039e279886c89257b6fddbc7
        run: |
          # 注入构建时间到 worker.mjs，确保每次 script hash 不同，强制 CF 更新 script
          sed -i "s/__BUILD_TIME__/$(date -u +%Y%m%dT%H%M%SZ)/" worker.mjs
          cat worker.mjs | head -4
          wrangler deploy --config config/wrangler.jsonc

      - name: Inject OWNER_TOKEN secret
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 142c76e0039e279886c89257b6fddbc7
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: echo "$OWNER_TOKEN" | wrangler secret put OWNER_TOKEN --name blackgod88

      - name: Verify /nx/soul proxy
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://blackgod88.jjiebbay.workers.dev/nx/soul)
          echo "/nx/soul → $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "401" ] && echo "✅ 代理生效" || (echo "❌ 代理异常"; exit 1)

      - name: Verify no token leak
        run: |
          COUNT=$(curl -s https://blackgod88.jjiebbay.workers.dev/ | grep -c "OWNER_TOKEN\|Bearer " || true)
          echo "token leak count: $COUNT"
          [ "$COUNT" = "0" ] && echo "✅ 无 token 泄露" || (echo "❌ token 泄露！"; exit 1)

      - name: Skip notice
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN，跳过部署。"
