name: Deploy blackgod88

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'worker.mjs'
      - 'config/wrangler.jsonc'
      - '.github/workflows/deploy-blackgod88.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@4 --no-audit --no-fund

      - name: Stamp build time into worker.mjs
        run: sed -i "s/__BUILD_TIME__/$(date -u +%Y%m%dT%H%M%SZ)/" worker.mjs

      - name: Deploy (script + assets + secrets in one shot)
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler deploy 一次性处理 script + assets + ASSETS binding
          wrangler deploy --config config/wrangler.jsonc
          # 在同一步内注入 OWNER_TOKEN，避免被覆盖
          echo "${{ secrets.OWNER_TOKEN }}" | wrangler secret put OWNER_TOKEN --name blackgod88

      - name: Verify /nx/soul proxy
        run: |
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://blackgod88.jjiebbay.workers.dev/nx/soul)
          echo "/nx/soul → $CODE"
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
            echo "✅ 代理生效"
          else
            echo "❌ 代理异常 (code=$CODE)，完整响应："
            curl -s https://blackgod88.jjiebbay.workers.dev/nx/soul | head -c 300
            exit 1
          fi

      - name: Verify no token leak
        run: |
          COUNT=$(curl -s https://blackgod88.jjiebbay.workers.dev/ | grep -c "OWNER_TOKEN\|nexus\.jjiebbay" || true)
          echo "token leak count: $COUNT"
          [ "$COUNT" = "0" ] && echo "✅ 无 token 泄露" || (echo "❌ token 泄露！"; exit 1)

      - name: Skip notice
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN，跳过部署。"
