name: Build Black God iOS

# 手动运行原生 iOS 回归与无签名发布构建；正式分发另需开发者签名。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen ninja llvm libarchive pkg-config

    - name: Generate Xcode Project
      run: |
        make generate

    - name: Run iOS regression tests
      run: |
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d["name"]))')
        make test-ios IOS_DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"

    - name: Build App (unsigned)
      run: |
        cd ios-app
        set -o pipefail
        xcodebuild build \
          -project BlackGod.xcodeproj \
          -scheme BlackGod \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package unsigned IPA
      run: |
        cd ios-app
        APP_PATH=$(find build -name "*.app" -type d | head -1)
        echo "App路径: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r BlackGod-unsigned.ipa Payload
        echo "✅ IPA: $(ls -lh BlackGod-unsigned.ipa)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod-unsigned-IPA
        path: ios-app/BlackGod-unsigned.ipa
        if-no-files-found: error
