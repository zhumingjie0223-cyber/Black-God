name: Build Black God iOS

# 自动验证原生改动；此流程只产生测试证据和无签名构建，不上传 App Store。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios-app/**'
      - 'tests/**'
      - 'tools/**'
      - 'vendor/**'
      - 'shuyu/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'tests/**'
      - 'tools/**'
      - 'vendor/**'
      - 'shuyu/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build tools
      run: brew install xcodegen ninja llvm lld libarchive pkg-config

    - name: 生成工程与运行镜像
      run: |
        set -euo pipefail
        generation_log="$RUNNER_TEMP/black-god-runtime-generation.log"
        set +e
        make generate 2>&1 | tee "$generation_log"
        generation_statuses=("${PIPESTATUS[@]}")
        set -e
        generation_status=${generation_statuses[0]}
        capture_status=${generation_statuses[1]}
        if (( generation_status != 0 )); then
          # 诊断失败不能覆盖真实生成失败；公开内容仅使用枚举字段。
          python3 tools/runtime/report_build_failure.py "$generation_log" "$generation_status" || true
          exit "$generation_status"
        fi
        if (( capture_status != 0 )); then
          printf '%s\n' '::error title=生成日志保存失败::工程生成返回成功，但完整日志未能保存。'
          exit "$capture_status"
        fi

    - name: 保存工程生成日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod-runtime-generation-log
        path: ${{ runner.temp }}/black-god-runtime-generation.log
        if-no-files-found: warn
        retention-days: 14

    - name: Verify guest uname memory boundaries
      run: python3 tools/runtime/test_uname.py

    - name: Verify bundled engine and both implementations
      run: make test-shuyu

    - name: Boot iOS Simulator
      id: sim
      run: |
        set -euo pipefail
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d["name"]))')
        xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
        xcrun simctl bootstatus "$DEVICE_ID" -b
        echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

    - name: Run iOS regression tests
      working-directory: ios-app
      run: |
        set -euo pipefail
        DEVICE_ID="${{ steps.sim.outputs.device_id }}"
        xcodebuild test \
          -project BlackGod.xcodeproj \
          -scheme BlackGod \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          -parallel-testing-enabled NO \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod-test-results
        path: ios-app/TestResults.xcresult
        if-no-files-found: warn
        retention-days: 14

    - name: Build App (unsigned)
      working-directory: ios-app
      run: |
        set -euo pipefail
        xcodebuild build \
          -project BlackGod.xcodeproj \
          -scheme BlackGod \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

    - name: Package unsigned IPA
      working-directory: ios-app
      run: |
        set -euo pipefail
        APP_PATH=build/Build/Products/Release-iphoneos/BlackGod.app
        test -d "$APP_PATH"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.blackgod.nexus'
        mkdir -p Payload
        ditto "$APP_PATH" Payload/BlackGod.app
        ditto -c -k --keepParent Payload BlackGod-unsigned.ipa

    - name: Upload unsigned build
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod-unsigned-IPA
        path: ios-app/BlackGod-unsigned.ipa
        if-no-files-found: error
        retention-days: 14
