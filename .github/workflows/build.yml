name: Build Black God 888 iOS

# 仅手动触发:产 unsigned IPA 做编译验证,不做分发。
# 正式签名 + 上传 TestFlight 走仓库根 codemagic.yaml(Codemagic 云端 Mac);
# 商店文案推送走 ios-app/AppStore/asc.py。
# 不在每次 push main 时自动跑,避免白烧 macOS Actions 额度;需要时到 Actions 页手动 Run。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        cd ios-app
        xcodegen generate
        ls -la

    - name: Build App (unsigned)
      run: |
        cd ios-app
        set -o pipefail
        xcodebuild build \
          -project BlackGod888.xcodeproj \
          -scheme BlackGod888 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package unsigned IPA
      run: |
        cd ios-app
        APP_PATH=$(find build -name "*.app" -type d | head -1)
        echo "App路径: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r BlackGod888-unsigned.ipa Payload
        echo "✅ IPA: $(ls -lh BlackGod888-unsigned.ipa)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod888-unsigned-IPA
        path: ios-app/BlackGod888-unsigned.ipa
        if-no-files-found: error
