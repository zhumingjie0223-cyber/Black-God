name: iOS 构建与回归

# 保留手动触发，按需运行 macOS 回归与无签名构建。
# 产物用于编译检查；正式签名、归档和 App Store 上传走独立发布流程。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: 运行原生任务回归
      run: bash tests/run_ios_runtime_tests.sh

    - name: 运行隔离存储回归
      run: bash ios-app/StorageTests/run.sh

    - name: Generate Xcode Project
      run: |
        cd ios-app
        xcodegen generate

    - name: Build App (unsigned)
      run: |
        cd ios-app
        set -o pipefail
        xcodebuild build \
          -project BlackGod888.xcodeproj \
          -scheme BlackGod888 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package unsigned IPA
      run: |
        cd ios-app
        app_path="build/Build/Products/Release-iphoneos/BlackGod888.app"
        test -d "$app_path"
        mkdir -p Payload
        cp -r "$app_path" Payload/
        zip -r BlackGod888-unsigned.ipa Payload
        echo "✅ IPA: $(ls -lh BlackGod888-unsigned.ipa)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGod888-unsigned-IPA
        path: ios-app/BlackGod888-unsigned.ipa
        if-no-files-found: error
