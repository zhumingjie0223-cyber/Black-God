name: 枢语引擎 CI

# 枢语源头引擎测试在本仓 shuyu/ 目录跑（原 shuyu-lang 仓 ci.yml 迁入并改路径）。
# nexus-do 消费副本已于 2026-09-05 随后端删除，shuyu/ 现为唯一权威源，只在其变动时触发。
on:
  push:
    branches: [main]
    paths:
      - 'shuyu/**'
      - '.github/workflows/shuyu-ci.yml'
  pull_request:
    paths:
      - 'shuyu/**'
      - '.github/workflows/shuyu-ci.yml'

jobs:
  node-tests:
    name: Node 测试（引擎/意识解释器/跨引擎一致性）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shuyu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test

  python-tests:
    name: Python 测试（shuyu_engine）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: shuyu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
