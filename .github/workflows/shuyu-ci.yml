name: 枢语引擎 CI

# 两仓合一后:枢语源头引擎测试在本仓 shuyu/ 目录跑（原 shuyu-lang 仓 ci.yml 迁入并改路径）。
# 校验当前枢语源头与 iOS 内置运行时，不再依赖已经退役的网页后端。
on:
  push:
    branches: [main]
    paths:
      - 'shuyu/**'
      - 'ios-app/ShuyuRuntime/**'
      - 'tools/shuyu/**'
      - '.github/workflows/shuyu-ci.yml'
  pull_request:
    paths:
      - 'shuyu/**'
      - 'ios-app/ShuyuRuntime/**'
      - 'tools/shuyu/**'
      - '.github/workflows/shuyu-ci.yml'

jobs:
  node-tests:
    name: Node 测试（引擎/意识解释器/跨引擎一致性）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shuyu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test

  python-tests:
    name: Python 测试（shuyu_engine）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: shuyu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  sync-check:
    name: 内置运行时同步校验（shuyu ↔ iOS）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/shuyu/bundle.py --check
