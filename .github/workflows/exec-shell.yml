name: Execute Shell Command

# 神枢「执行脑」的 GitHub Actions 通道：
# nexus_do.core.mjs 的 execDispatchGH() 派发本工作流跑命令，execPollGH() 回收日志。
# 结果解析依赖下面 `::group::Command Output` / `::endgroup::` 两个标记（见 parseGHLogs），
# 改这两行会直接打断神枢的结果回收，务必别动。
#
# 安全说明：本工作流按设计就是执行调用方给的命令（上游有 execDispatchGH 的
# 长度限制 + 危险命令黑名单 + GITHUB_API 令牌把关），本身不做二次判定。
# 但命令值一律经 env 传给 bash，绝不用 ${{ }} 直接内插进脚本正文 ——
# 避免命令内容混进工作流脚本本体、篡改上面那两个标记导致结果错乱。

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Shell command to execute'
        required: true
        type: string

jobs:
  run-cmd:
    runs-on: ubuntu-latest
    steps:
      - name: Execute command
        id: exec
        env:
          CMD: ${{ inputs.cmd }}
        run: |
          echo "::group::Command Output"
          bash -c "$CMD"
          echo "::endgroup::"
        shell: bash
        continue-on-error: true
